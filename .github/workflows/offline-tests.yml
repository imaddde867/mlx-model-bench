name: Offline regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Verify committed numerical audit
        run: python audit_p3_numeric.py --check
      - name: Verify generated comparison is current
        run: |
          python compare.py --out /tmp/mlx-model-compare.md
          diff -u results/COMPARE.md /tmp/mlx-model-compare.md
      - name: Validate complete statistical study against committed evidence
        run: |
          python study.py --out /tmp/mlx-model-study.md
          test -s /tmp/mlx-model-study.md
